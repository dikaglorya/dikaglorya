<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>DikaOfc capability map</title>
<link rel="stylesheet" href="/scripts/panel.css">
<style>
  .fan {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .fan-card {
    position: absolute;
    left: -101px;
    top: -146px;
    width: 202px;
    height: 292px;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .fc-back {
    position: absolute;
    inset: -1px;
    transform: translateZ(-17px);
    background: linear-gradient(145deg, rgba(19, 50, 60, 0.9), rgba(4, 9, 12, 0.97));
    border: 1px solid rgba(159, 232, 255, 0.14);
    box-shadow: 0 26px 50px rgba(0, 0, 0, 0.5);
  }

  .fc-face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
      linear-gradient(160deg, rgba(24, 37, 45, 0.98) 0%, rgba(10, 18, 23, 0.99) 52%, rgba(6, 11, 15, 0.99) 100%);
    border: 1px solid rgba(159, 232, 255, 0.2);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      inset 0 0 0 1px rgba(0, 0, 0, 0.35),
      0 24px 60px rgba(0, 0, 0, 0.44);
  }

  .fc-face::before {
    content: '';
    position: absolute;
    left: 8%;
    right: 8%;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(159, 232, 255, 0.72), transparent);
  }

  .fc-face::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 46%;
    background: linear-gradient(0deg, rgba(31, 99, 120, 0.1), transparent);
    pointer-events: none;
  }

  .fc-content {
    position: relative;
    z-index: 2;
    padding: 17px 17px 15px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .fc-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .fc-index {
    font-family: var(--display);
    font-size: 30px;
    line-height: 0.9;
    color: rgba(226, 248, 252, 0.92);
    letter-spacing: -0.04em;
  }

  .fc-reticle {
    position: relative;
    width: 24px;
    height: 24px;
    border: 1px solid rgba(159, 232, 255, 0.25);
    border-radius: 50%;
    will-change: transform;
  }

  .fc-reticle::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(159, 232, 255, 0.18);
    border-radius: 50%;
  }

  .fc-reticle::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    margin: -1.5px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
  }

  .fc-reticle i {
    position: absolute;
    left: 50%;
    top: -1px;
    width: 1px;
    height: 9px;
    background: var(--accent);
    transform-origin: 0 13px;
    box-shadow: 0 0 6px rgba(159, 232, 255, 0.8);
  }

  .fc-label {
    margin-top: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .fc-rule {
    height: 1px;
    margin: 13px 0 14px;
    background: linear-gradient(90deg, rgba(159, 232, 255, 0.4), rgba(159, 232, 255, 0.07) 62%, transparent);
  }

  .fc-items {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
  }

  .fc-items li {
    position: relative;
    padding-left: 13px;
    margin-bottom: 12px;
    font-size: 15px;
    line-height: 1.22;
    letter-spacing: 0.015em;
    color: rgba(223, 240, 245, 0.9);
  }

  .fc-items li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.44em;
    width: 4px;
    height: 4px;
    border: 1px solid rgba(159, 232, 255, 0.72);
    transform: rotate(45deg);
  }

  .fc-items li:first-child {
    color: #f3fcff;
  }

  .fc-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid rgba(159, 232, 255, 0.1);
    font-size: 7.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(143, 165, 175, 0.66);
  }

  .fc-foot b {
    color: var(--accent);
    font-weight: 500;
  }

  .fc-scan {
    position: absolute;
    left: -20%;
    top: 0;
    width: 36%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(207, 249, 255, 0.075), transparent);
    transform: skewX(-9deg);
    mix-blend-mode: screen;
    pointer-events: none;
    will-change: transform;
  }

  .fc-bar {
    position: absolute;
    left: 16px;
    bottom: 7px;
    width: 74px;
    height: 1px;
    background: linear-gradient(90deg, rgba(159, 232, 255, 0.6), transparent);
    transform-origin: left center;
    will-change: transform;
  }

  .fan-card.warm .fc-label,
  .fan-card.warm .fc-foot b { color: var(--warm); }

  .fan-card.warm .fc-reticle::after { background: var(--warm); box-shadow: 0 0 8px var(--warm); }
  .fan-card.warm .fc-reticle i { background: var(--warm); }
  .fan-card.warm .fc-items li::before { border-color: rgba(255, 155, 107, 0.72); }

  .fan-ring {
    position: absolute;
    left: 50%;
    top: 53%;
    width: 1020px;
    height: 1020px;
    margin-left: -510px;
    margin-top: -510px;
    border: 1px solid rgba(159, 232, 255, 0.24);
    border-radius: 50%;
    transform-style: preserve-3d;
    will-change: transform;
    opacity: 0.6;
    pointer-events: none;
  }

  .fan-ring::before,
  .fan-ring::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 1px dashed rgba(159, 232, 255, 0.12);
  }

  .fan-ring::before { inset: 26px; }
  .fan-ring::after { inset: 82px; border-style: solid; border-color: rgba(159, 232, 255, 0.06); }

  .fan-ring .bead {
    position: absolute;
    left: 50%;
    top: -3px;
    width: 7px;
    height: 7px;
    margin-left: -3.5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 18px rgba(159, 232, 255, 0.9);
  }

  .fan-ring.second {
    width: 1240px;
    height: 1240px;
    margin-left: -620px;
    margin-top: -620px;
    border-color: rgba(255, 155, 107, 0.12);
    opacity: 0.34;
  }

  .fan-ring.second .bead {
    background: var(--warm);
    box-shadow: 0 0 16px rgba(255, 155, 107, 0.7);
  }

  .bus {
    position: absolute;
    left: 50%;
    top: 73.5%;
    width: 1020px;
    height: 1px;
    margin-left: -510px;
    background: linear-gradient(90deg, transparent, rgba(159, 232, 255, 0.28) 12%, rgba(159, 232, 255, 0.28) 88%, transparent);
    transform: translateZ(-130px);
    opacity: 0.6;
    z-index: -2;
  }

  .bus .pulse {
    position: absolute;
    top: -2px;
    width: 5px;
    height: 5px;
    margin-top: -1px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
    will-change: transform;
  }

  .bus .pulse.warm {
    background: var(--warm);
    box-shadow: 0 0 12px var(--warm);
  }

  .ax-line {
    position: absolute;
    top: 7%;
    bottom: 13%;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(159, 232, 255, 0.13), transparent);
    opacity: 0.55;
    transform: translateZ(-260px);
    z-index: -3;
  }

  .fan-halo {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 960px;
    height: 500px;
    margin-left: -480px;
    margin-top: -250px;
    background: radial-gradient(ellipse, rgba(35, 120, 145, 0.22), transparent 66%);
    filter: blur(18px);
    transform: translateZ(-240px);
    z-index: -4;
    pointer-events: none;
  }

  .giant-five {
    position: absolute;
    right: 18px;
    top: 44px;
    font-family: var(--display);
    font-size: 300px;
    line-height: 0.8;
    color: transparent;
    -webkit-text-stroke: 1px rgba(159, 232, 255, 0.06);
    transform: translateZ(-300px) rotateY(-18deg);
    z-index: -5;
    pointer-events: none;
    user-select: none;
  }

  .title-block {
    position: absolute;
    left: 36px;
    top: 72px;
    z-index: 21;
    pointer-events: none;
  }

  .title-block .title {
    margin-top: 13px;
    font-family: var(--display);
    font-size: 34px;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: #effaff;
  }

  .title-block .sub {
    margin-top: 10px;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(143, 165, 175, 0.76);
  }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div class="grid-floor" id="grid"></div>
  <div class="horizon-glow"></div>

  <div class="camera" id="camera">
    <div class="giant-five">5</div>
    <div class="fan-halo"></div>

    <div class="fan-ring" id="ringA"><span class="bead"></span></div>
    <div class="fan-ring second" id="ringB"><span class="bead"></span></div>

    <div class="ax-line" style="left: 8%"></div>
    <div class="ax-line" style="left: 25%"></div>
    <div class="ax-line" style="left: 75%"></div>
    <div class="ax-line" style="left: 92%"></div>

    <div class="bus" id="bus">
      <span class="pulse" data-phase="0.05"></span>
      <span class="pulse" data-phase="0.42"></span>
      <span class="pulse warm" data-phase="0.72"></span>
    </div>

    <div class="fan" id="fan"></div>

    <div class="particles" id="particles"></div>
  </div>

  <div class="scanline" id="scanline"></div>
  <div class="frame"></div>

  <div class="title-block">
    <div class="kicker"><span class="dot" id="pulseDot"></span><b>Technical focus</b><span>/ capability map</span></div>
    <div class="title">WHAT I BUILD WITH</div>
    <div class="sub">Languages · Web · Systems · AI · Automation</div>
  </div>

  <div class="hud">
    <div class="top-right">LIVE / 05 DOMAINS<br><b>SCAN <span id="scanIndex">000</span> / 120</b></div>
    <div class="bottom-left"><b>MAP</b> <span>05</span><em>/</em> NOT A CLAIM OF EQUAL DEPTH</div>
    <div class="bottom-right">SIGNAL <span id="signal">97.8%</span><br>TECHNICAL FOCUS / 2026</div>
  </div>
</div>

<script type="module">
import { initHud, applyHud } from '/scripts/hud.mjs';
initHud();

const $ = selector => document.querySelector(selector);
const TwoPi = Math.PI * 2;
await document.fonts.ready;

const cards = [
  {
    index: '01',
    label: 'LANGUAGES',
    items: ['TypeScript', 'JavaScript', 'Python', 'Kotlin'],
    foot: ['04', 'STACKS'],
    warm: false,
  },
  {
    index: '02',
    label: 'WEB',
    items: ['React', 'Vite', 'Node.js', 'Interfaces'],
    foot: ['04', 'STACKS'],
    warm: false,
  },
  {
    index: '03',
    label: 'SYSTEMS',
    items: ['Linux', 'Termux', 'Android', 'Shell tooling'],
    foot: ['04', 'STACKS'],
    warm: false,
  },
  {
    index: '04',
    label: 'AI',
    items: ['OpenAI APIs', 'Local models', 'Coding agents', 'Routing'],
    foot: ['04', 'LAYERS'],
    warm: true,
  },
  {
    index: '05',
    label: 'AUTOMATION',
    items: ['Telegram bots', 'Telethon', 'Workflows', 'Tooling'],
    foot: ['04', 'FLOWS'],
    warm: false,
  },
];

const layout = [
  { x: -424, y: 22, z: -90, ry: 19, rx: 2.5 },
  { x: -212, y: 9, z: 26, ry: 9, rx: 1.5 },
  { x: 0, y: 0, z: 126, ry: 0, rx: 0 },
  { x: 212, y: 9, z: 26, ry: -9, rx: 1.5 },
  { x: 424, y: 22, z: -90, ry: -19, rx: 2.5 },
];

const fan = $('#fan');
const cardEls = [];
cards.forEach((card, i) => {
  const el = document.createElement('article');
  el.className = `fan-card${card.warm ? ' warm' : ''}`;
  el.innerHTML = `
    <div class="fc-back"></div>
    <div class="fc-face">
      <div class="fc-content">
        <div class="fc-top">
          <span class="fc-index">${card.index}</span>
          <span class="fc-reticle"><i></i></span>
        </div>
        <div class="fc-label">${card.label}</div>
        <div class="fc-rule"></div>
        <ul class="fc-items">${card.items.map(item => `<li>${item}</li>`).join('')}</ul>
        <div class="fc-foot"><span><b>${card.foot[0]}</b> ${card.foot[1]}</span><span>LIVE</span></div>
        <div class="fc-bar"></div>
      </div>
      <div class="fc-scan"></div>
    </div>
  `;
  fan.appendChild(el);
  cardEls.push({
    el,
    base: layout[i],
    phase: i * 0.9,
    reticle: el.querySelector('.fc-reticle i'),
    scan: el.querySelector('.fc-scan'),
    bar: el.querySelector('.fc-bar'),
  });
});

const particles = [];
let seed = 20261021;
function rand() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}
for (let i = 0; i < 26; i++) {
  const p = document.createElement('i');
  p.className = 'particle';
  p.style.left = `${4 + rand() * 92}%`;
  p.style.top = `${12 + rand() * 72}%`;
  p.style.width = `${0.7 + rand() * 1.8}px`;
  p.style.height = p.style.width;
  p.style.opacity = `${0.1 + rand() * 0.35}`;
  p.dataset.phase = String(rand() * TwoPi);
  p.dataset.speed = String(0.5 + rand() * 1.5);
  p.style.transform = `translateZ(${-220 + rand() * 340}px)`;
  $('#particles').appendChild(p);
  particles.push(p);
}

const camera = $('#camera');
const fanRingA = $('#ringA');
const fanRingB = $('#ringB');
const bus = $('#bus');
const scanline = $('#scanline');
const pulseDot = $('#pulseDot');
const scanIndex = $('#scanIndex');
const signalEl = $('#signal');
const grid = $('#grid');
const busPulses = [...document.querySelectorAll('.bus .pulse')];

const AX = [0, 1, 2, 3, 4];

function setFrame(t) {
  const a = t * TwoPi;

  camera.style.transform = `translate3d(${Math.sin(a + 0.35) * 18}px, ${Math.cos(a * 2 + 0.2) * 8}px, 0) rotateY(${Math.sin(a + 0.65) * 5.2}deg) rotateX(${Math.cos(a + 0.4) * 1.7}deg)`;
  fan.style.transform = `rotateY(${Math.sin(a + 1.1) * 3.4}deg) rotateX(${3.5 + Math.cos(a * 2 + 0.3) * 1.7}deg) translateZ(${Math.sin(a + 0.8) * 14}px)`;

  cardEls.forEach(({ el, base, phase, reticle, scan, bar }, i) => {
    const float = Math.sin(a * 2 + phase) * 7;
    const sway = Math.sin(a + phase * 0.8) * 1.6;
    const depth = Math.sin(a + phase) * 10;
    el.style.transform = `translate3d(${base.x + Math.sin(a + phase) * 4}px, ${base.y + float}px, ${base.z + depth}px) rotateY(${base.ry + sway}deg) rotateX(${base.rx + Math.cos(a + phase) * 1.2}deg)`;
    reticle.style.transform = `rotate(${a * 120 + i * 36}deg)`;
    const scanP = 0.5 - 0.5 * Math.cos(a + i * 0.9);
    scan.style.transform = `translate3d(${-70 + scanP * 280}px, 0, 0) skewX(-9deg)`;
    scan.style.opacity = String(0.1 + 0.5 * Math.sin(Math.PI * scanP));
    bar.style.transform = `scaleX(${0.2 + 0.8 * (0.5 + 0.5 * Math.sin(a * 2 + i))})`;
  });

  fanRingA.style.transform = `rotateX(72deg) rotateZ(${a * 18}deg) translateZ(-210px)`;
  fanRingB.style.transform = `rotateX(64deg) rotateZ(${35 - a * 11}deg) translateZ(-320px)`;

  busPulses.forEach((pulse, i) => {
    const phase = Number(pulse.dataset.phase);
    const frac = (t + phase) % 1;
    pulse.style.transform = `translate3d(${frac * 1000}px, 0, 0)`;
    pulse.style.opacity = String(0.12 + 0.88 * Math.sin(Math.PI * frac));
  });

  particles.forEach((p, i) => {
    const phase = Number(p.dataset.phase);
    const speed = Number(p.dataset.speed);
    const dx = Math.sin(a * speed + phase) * 14;
    const dy = Math.cos(a * (speed * 0.8) + phase) * 10;
    p.style.transform = `translate3d(${dx}px, ${dy}px, ${-220 + (i * 17) % 340}px)`;
    p.style.opacity = String(0.08 + 0.28 * (0.5 + 0.5 * Math.sin(a * 2.5 + i)));
  });

  const beamP = 0.5 - 0.5 * Math.cos(a);
  scanline.style.transform = `translateY(${beamP * 520}px)`;
  scanline.style.opacity = String(0.07 + 0.32 * Math.sin(Math.PI * beamP));
  pulseDot.style.opacity = String(0.45 + 0.55 * (0.5 + 0.5 * Math.sin(a * 8)));
  pulseDot.style.transform = `scale(${1 + 0.5 * Math.sin(a * 8)})`;
  scanIndex.textContent = String(Math.round(t * 120)).padStart(3, '0');
  signalEl.textContent = `${(97.8 + Math.sin(a) * 1.0).toFixed(1)}%`;
  grid.style.backgroundPosition = `0 ${t * 74}px, ${t * 74}px 0`;

  applyHud(t);
}

window.__setFrame = setFrame;
window.__ready = false;
setFrame(0);
window.__ready = true;
</script>
</body>
</html>
