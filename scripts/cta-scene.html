<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>DikaOfc contact gate</title>
<style>
  @font-face {
    font-family: 'JBMono';
    src: url('/scripts/fonts/JetBrainsMono.ttf') format('truetype');
    font-weight: 100 800;
  }
  @font-face {
    font-family: 'ArchivoBlack';
    src: url('/scripts/fonts/ArchivoBlack-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  html, body { margin: 0; padding: 0; width: 1200px; height: 260px; overflow: hidden; background: #07090c; }
  canvas { display: block; width: 1200px; height: 260px; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="260"></canvas>
<script type="module">
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1200;
const H = 260;
const FRAMES = 48;
const ACCENT = '#8edcf0';
const INK = '#eaf1f5';
const MUTED = '#93a6b0';

const mono = new FontFace('JBMono', 'url(/scripts/fonts/JetBrainsMono.ttf)');
const display = new FontFace('ArchivoBlack', 'url(/scripts/fonts/ArchivoBlack-Regular.ttf)');
await Promise.all([mono.load(), display.load()]);
document.fonts.add(mono);
document.fonts.add(display);

function drawBackground(a) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#07090c';
  ctx.fillRect(0, 0, W, H);

  // breathing ambient glow
  const glow = ctx.createRadialGradient(980, 130, 10, 980, 130, 520);
  const breathe = 0.5 + 0.5 * Math.sin(a * 2);
  glow.addColorStop(0, `rgba(36, 91, 112, ${0.2 + breathe * 0.1})`);
  glow.addColorStop(0.5, 'rgba(24, 58, 72, 0.10)');
  glow.addColorStop(1, 'rgba(7, 9, 12, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // far layer (parallax: slow)
  const driftSlow = (a / (Math.PI * 2)) * 12;
  ctx.strokeStyle = 'rgba(155, 168, 178, 0.02)';
  ctx.lineWidth = 1;
  for (let x = -30 + driftSlow; x < W + 30; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, H);
    ctx.stroke();
  }

  // near layer (fast drift, both axes = depth cue)
  const drift = (a / (Math.PI * 2)) * 30;
  const ydrift = (a / (Math.PI * 2)) * 30;
  ctx.strokeStyle = 'rgba(155, 168, 178, 0.045)';
  for (let x = -30 + drift; x < W + 30; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, H);
    ctx.stroke();
  }
  for (let y = -30 + ydrift; y < H + 30; y += 30) {
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(W, y + 0.5);
    ctx.stroke();
  }

  // travelling horizontal light beams (receding corridor feel)
  for (let k = 0; k < 3; k++) {
    const p = ((a / (Math.PI * 2)) + k / 3) % 1;
    const by = p * H;
    const beam = ctx.createLinearGradient(0, by - 26, 0, by + 26);
    beam.addColorStop(0, 'rgba(142, 220, 240, 0)');
    beam.addColorStop(0.5, `rgba(142, 220, 240, ${0.05 + 0.04 * Math.sin(Math.PI * p)})`);
    beam.addColorStop(1, 'rgba(142, 220, 240, 0)');
    ctx.fillStyle = beam;
    ctx.fillRect(0, by - 26, W, 52);
  }

  // drifting glyph field (everything moves — no still frame in this strip)
  const glyphs = ['+', '×', '/', '·', 'Λ', '§', '0', '1'];
  ctx.font = '10px JBMono';
  for (let i = 0; i < 14; i++) {
    const speed = 0.5 + (i % 3) * 0.28;
    const gx = (i * 97 + (a / (Math.PI * 2)) * 210 * speed) % (W + 40) - 20;
    const gy = (i * 53 + (a / (Math.PI * 2)) * 120 * (0.4 + speed)) % (H + 60) - 30;
    const alpha = 0.05 + 0.11 * (0.5 + 0.5 * Math.sin(a * 3 + i * 1.9));
    ctx.fillStyle = i % 5 === 0 ? `rgba(255, 176, 138, ${alpha.toFixed(3)})` : `rgba(142, 220, 240, ${alpha.toFixed(3)})`;
    ctx.textAlign = 'center';
    ctx.fillText(glyphs[i % glyphs.length], gx, gy);
    ctx.textAlign = 'left';
  }

  const beamR = ctx.createLinearGradient(820, 0, 1160, 0);
  beamR.addColorStop(0, 'rgba(142, 220, 240, 0)');
  beamR.addColorStop(0.5 + 0.2 * Math.sin(a), `rgba(142, 220, 240, ${0.06 + 0.05 * (0.5 + 0.5 * Math.sin(a * 1.6))})`);
  beamR.addColorStop(1, 'rgba(142, 220, 240, 0)');
  ctx.fillStyle = beamR;
  ctx.fillRect(820, 100, 340, 60);
}

// deterministic glitch flag per char
function glitchChar(i, seg) {
  return ((Math.imul(i + 1, 2654435761) ^ Math.imul(seg + 7, 40503)) >>> 0) % 26 < 2;
}

function drawText(a) {
  const seg = Math.floor(a * 48 / (Math.PI * 4)); // glitch windows per loop

  // ---- kicker: per-char shimmer + bob ----
  ctx.textAlign = 'left';
  ctx.font = '600 11px JBMono';
  const kicker = 'OPEN CHANNEL / 2026';
  let kx = 70;
  for (let i = 0; i < kicker.length; i++) {
    const bob = Math.sin(a * 2 + i * 0.42) * 0.9;
    ctx.globalAlpha = 0.66 + 0.34 * (0.5 + 0.5 * Math.sin(a * 3.2 + i * 0.42));
    if (glitchChar(i, seg)) {
      ctx.fillStyle = 'rgba(255, 150, 110, 0.85)';
      ctx.fillText(kicker[i], kx + 1.2, 54 + bob);
      ctx.fillStyle = 'rgba(110, 220, 255, 0.85)';
      ctx.fillText(kicker[i], kx - 1.2, 54 + bob);
    }
    ctx.fillStyle = ACCENT;
    ctx.fillText(kicker[i], kx, 54 + bob);
    kx += ctx.measureText(kicker[i]).width;
  }
  ctx.globalAlpha = 1;

  const pulse = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(a * 4));
  ctx.fillStyle = ACCENT;
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  ctx.arc(286, 50, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // ---- headline: per-letter float + glitch burst + traveling chrome highlight ----
  const lines = [
    { text: "LET'S BUILD", y: 112 },
    { text: 'SOMETHING USEFUL.', y: 156 },
  ];
  ctx.font = '400 44px ArchivoBlack';
  // one seamless chrome sheen pass per loop (no jump, no rectangles)
  const sweep = a / (Math.PI * 2);
  const sweepX = 40 + sweep * 610;
  for (const line of lines) {
    // shadow layer (also floats — keeps depth)
    let sx = 72;
    for (let i = 0; i < line.text.length; i++) {
      const bob = Math.sin(a * 2 + i * 0.34) * 2.6;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillText(line.text[i], sx, line.y + 2 + bob);
      sx += ctx.measureText(line.text[i]).width;
    }
    // face layer with per-letter glow + glitch
    let fx = 70;
    for (let i = 0; i < line.text.length; i++) {
      const bob = Math.sin(a * 2 + i * 0.34) * 2.6;
      const glow = 0.10 + 0.12 * (0.5 + 0.5 * Math.sin(a * 3 + i * 0.42));
      if (glitchChar(i, seg)) {
        ctx.fillStyle = 'rgba(255, 150, 110, 0.8)';
        ctx.fillText(line.text[i], fx + 1.8, line.y + bob);
        ctx.fillStyle = 'rgba(110, 220, 255, 0.8)';
        ctx.fillText(line.text[i], fx - 1.8, line.y + bob);
      }
      ctx.fillStyle = INK;
      ctx.fillText(line.text[i], fx, line.y + bob);
      ctx.globalAlpha = glow;
      ctx.fillStyle = ACCENT;
      ctx.fillText(line.text[i], fx, line.y + bob);
      ctx.globalAlpha = 1;
      const w = ctx.measureText(line.text[i]).width;
      // per-letter chrome highlight riding the sweep
      const dd = Math.abs(fx + w / 2 - sweepX);
      if (dd < 120) {
        const f = 1 - dd / 120;
        ctx.globalAlpha = 0.5 * f;
        ctx.fillStyle = 'rgba(243, 253, 255, 0.95)';
        ctx.fillText(line.text[i], fx, line.y + bob);
        ctx.globalAlpha = 1;
      }
      fx += w;
    }
  }

  // ---- subtitle: infinite marquee ----
  const sub = 'Open to selected projects and collaboration.  ✦  ObitoGlory.tech  ✦  DikaCode build journal  ✦  ';
  ctx.save();
  ctx.beginPath();
  ctx.rect(64, 180, 660, 24);
  ctx.clip();
  ctx.font = '13px JBMono';
  const subW = ctx.measureText(sub).width;
  const gap2 = 46;
  const cycle = subW + gap2;
  const marq = -((a / (Math.PI * 2)) * 220) % cycle;
  for (let rep = 0; rep < 3; rep++) {
    let mx2 = 70 + marq + rep * cycle;
    if (mx2 - subW > 730 || mx2 < -subW) continue;
    let ci = 0;
    for (let i = 0; i < sub.length; i++) {
      const alpha = 0.5 + 0.5 * (0.5 + 0.5 * Math.sin(a * 3 - (mx2 - 70) * 0.02));
      ctx.fillStyle = `rgba(147, 166, 176, ${(0.35 + 0.55 * alpha).toFixed(3)})`;
      if (sub[i] === '✦') ctx.fillStyle = `rgba(255, 176, 138, ${(0.5 + 0.4 * alpha).toFixed(3)})`;
      ctx.fillText(sub[i], mx2, 194);
      mx2 += ctx.measureText(sub[i]).width;
      ci++;
    }
  }
  ctx.restore();

  // ---- bottom channels: counter-scrolling marquee with per-char light ----
  const chan = 'PORTFOLIO · PROJECTS · CONTACT · JOURNAL · TELEGRAM · ';
  ctx.font = '10px JBMono';
  const chanW = ctx.measureText(chan).width;
  const chanCycle = chanW + 60;
  const chanMarq = ((a / (Math.PI * 2)) * 160) % chanCycle;
  ctx.save();
  ctx.beginPath();
  ctx.rect(64, 214, 660, 18);
  ctx.clip();
  for (let rep = 0; rep < 3; rep++) {
    let cx2 = 70 - chanMarq + rep * chanCycle;
    if (cx2 - chanW > 730 || cx2 < -chanW) continue;
    for (let i = 0; i < chan.length; i++) {
      const alpha = 0.5 + 0.5 * (0.5 + 0.5 * Math.sin(a * 4 + (cx2 - 70) * 0.03));
      ctx.fillStyle = i % 2 === 0
        ? `rgba(142, 220, 240, ${(0.4 + 0.5 * alpha).toFixed(3)})`
        : `rgba(147, 166, 176, ${(0.28 + 0.5 * alpha).toFixed(3)})`;
      ctx.fillText(chan[i], cx2, 226);
      cx2 += ctx.measureText(chan[i]).width;
    }
  }
  ctx.restore();

  const rule = ctx.createLinearGradient(70, 0, 760, 0);
  rule.addColorStop(0, 'rgba(142, 220, 240, 0.42)');
  rule.addColorStop(0.6, 'rgba(142, 220, 240, 0.08)');
  rule.addColorStop(1, 'rgba(142, 220, 240, 0)');
  ctx.strokeStyle = rule;
  ctx.beginPath();
  ctx.moveTo(70, 238.5);
  ctx.lineTo(760, 238.5);
  ctx.stroke();

  const mx = 70 + ((a / (Math.PI * 2)) % 1) * 690;
  const moving = ctx.createLinearGradient(mx - 80, 0, mx, 0);
  moving.addColorStop(0, 'rgba(142, 220, 240, 0)');
  moving.addColorStop(1, 'rgba(142, 220, 240, 0.5)');
  ctx.strokeStyle = moving;
  ctx.beginPath();
  ctx.moveTo(Math.max(70, mx - 80), 238.5);
  ctx.lineTo(mx, 238.5);
  ctx.stroke();
}

function drawPortal(a) {
  const cx = 980;
  const cy = 128;
  const squash = 0.7;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, squash);

  // tunnel depth: several offset ellipses behind the main ring
  for (let d = 4; d >= 1; d--) {
    ctx.strokeStyle = `rgba(142, 220, 240, ${0.028 * d})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, d * 9, 88 - d * 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // outer ring
  ctx.strokeStyle = 'rgba(142, 220, 240, 0.20)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 92, 0, Math.PI * 2);
  ctx.stroke();

  // rotating tick ring
  const rot = a / (Math.PI * 2);
  for (let i = 0; i < 48; i++) {
    const ang = (i / 48) * Math.PI * 2 + rot * Math.PI * 2;
    const major = i % 6 === 0;
    const r1 = 86;
    const r2 = major ? 77 : 82;
    ctx.strokeStyle = major
      ? 'rgba(168, 236, 255, 0.72)'
      : 'rgba(142, 220, 240, 0.22)';
    ctx.lineWidth = major ? 1.6 : 1;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
    ctx.lineTo(Math.cos(ang) * r2, Math.sin(ang) * r2);
    ctx.stroke();
  }

  // counter-rotating arcs
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(142, 220, 240, 0.55)';
  ctx.beginPath();
  ctx.arc(0, 0, 70, a + 0.2, a + 1.25);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(142, 220, 240, 0.28)';
  ctx.beginPath();
  ctx.arc(0, 0, 70, a + Math.PI + 0.5, a + Math.PI + 1.5);
  ctx.stroke();

  // inner thin rings
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(142, 220, 240, 0.32)';
  ctx.beginPath();
  ctx.arc(0, 0, 56, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(142, 220, 240, 0.16)';
  ctx.beginPath();
  ctx.arc(0, 0, 44, 0, Math.PI * 2);
  ctx.stroke();

  // counter-rotating dashed ring
  ctx.save();
  ctx.rotate(-a * 1.4);
  ctx.strokeStyle = 'rgba(142, 220, 240, 0.36)';
  ctx.setLineDash([4, 9]);
  ctx.beginPath();
  ctx.arc(0, 0, 34, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // glowing core
  const breathe = 0.5 + 0.5 * Math.sin(a * 2);
  const core = ctx.createRadialGradient(0, 0, 1, 0, 0, 30 + breathe * 6);
  core.addColorStop(0, 'rgba(234, 250, 255, 0.96)');
  core.addColorStop(0.18, 'rgba(168, 236, 255, 0.9)');
  core.addColorStop(0.45, 'rgba(142, 220, 240, 0.34)');
  core.addColorStop(1, 'rgba(36, 91, 112, 0)');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(0, 0, 32 + breathe * 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(245, 252, 255, 0.98)';
  ctx.beginPath();
  ctx.arc(0, 0, 3.2 + breathe * 1.0, 0, Math.PI * 2);
  ctx.fill();

  // orbiting satellites
  for (let k = 0; k < 6; k++) {
    const dir = k % 2 === 0 ? 1 : -1;
    const ang = a * dir * (1.2 + k * 0.12) + (k / 6) * Math.PI * 2;
    const radius = 50 + (k % 3) * 8;
    const x = Math.cos(ang) * radius;
    const y = Math.sin(ang) * radius;
    ctx.fillStyle = k === 3 ? 'rgba(255, 176, 138, 0.9)' : 'rgba(168, 236, 255, 0.9)';
    ctx.beginPath();
    ctx.arc(x, y, k % 2 === 0 ? 2.2 : 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(142, 220, 240, 0.12)';
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // orbiting console label ring — text rides the ring tangentially
  const labels = ['SIGNAL', 'GATE / 01', 'OPEN 2026', 'OBITO.TECH', 'DIKACODE', 'CONTACT'];
  ctx.font = '600 8px JBMono';
  labels.forEach((label, k) => {
    const ang = a * (k % 2 ? -0.55 : 0.85) + (k / labels.length) * Math.PI * 2;
    const radius = 108;
    const lx = Math.cos(ang) * radius;
    const ly = Math.sin(ang) * radius;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(ang + Math.PI / 2);
    const la = 0.3 + 0.42 * (0.5 + 0.5 * Math.sin(a * 2.6 + k * 1.4));
    ctx.fillStyle = `rgba(142, 220, 240, ${la.toFixed(3)})`;
    if (k === 3 && Math.sin(a * 2.6 + k * 1.4) > 0.4) ctx.fillStyle = `rgba(255, 176, 138, ${la.toFixed(3)})`;
    ctx.textAlign = 'center';
    ctx.fillText(label, 0, 0);
    ctx.textAlign = 'left';
    ctx.restore();
  });

  ctx.restore();

  // floating shards around the rim — wired with 3D-ish depth wobble
  ctx.save();
  ctx.translate(cx, cy);
  for (let i = 0; i < 9; i++) {
    const ang = a * (0.5 + i * 0.08) + i * 1.9;
    const depth = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(a * 1.9 + i * 2.2));
    const radius = (108 + (i % 3) * 11) * depth;
    const x = Math.cos(ang) * radius;
    const y = Math.sin(ang) * radius * 0.7;
    const s = 2 + depth * 3;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang + a);
    ctx.fillStyle = i === 2 ? 'rgba(255, 176, 138, 0.34)' : 'rgba(142, 220, 240, 0.26)';
    ctx.fillRect(-s / 2, -s / 2, s, s);
    // glow halo
    ctx.globalAlpha = 0.35 * (0.5 + 0.5 * Math.sin(a * 3 + i));
    ctx.fillRect(-s / 2 - 2.5, -s / 2 - 2.5, s + 5, s + 5);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  ctx.restore();

  // vertical divider
  const divider = ctx.createLinearGradient(0, 38, 0, 222);
  divider.addColorStop(0, 'rgba(142, 220, 240, 0)');
  divider.addColorStop(0.5, 'rgba(142, 220, 240, 0.16)');
  divider.addColorStop(1, 'rgba(142, 220, 240, 0)');
  ctx.strokeStyle = divider;
  ctx.beginPath();
  ctx.moveTo(824.5, 38);
  ctx.lineTo(824.5, 222);
  ctx.stroke();
}

function drawFooter(a) {
  ctx.font = '10px JBMono';
  ctx.textAlign = 'left';
  const signal = 97.8 + Math.sin(a) * 0.8;
  const text = `GATE / 01 · SIGNAL ${signal.toFixed(1)}%`;
  const total = ctx.measureText(text).width;
  let x = 1130 - total;
  for (let i = 0; i < text.length; i++) {
    // right-to-left travelling light on the footer too
    const wave = 0.5 + 0.5 * Math.sin(a * 3.2 - i * 0.35);
    ctx.fillStyle = `rgba(147, 166, 176, ${(0.4 + 0.34 * wave).toFixed(3)})`;
    ctx.fillText(text[i], x, 238);
    x += ctx.measureText(text[i]).width;
  }
}

function setFrame(t) {
  const a = t * Math.PI * 2;
  drawBackground(a);
  drawText(a);
  drawPortal(a);
  drawFooter(a);
}

window.__setFrame = setFrame;
window.__ready = false;
setFrame(0);
window.__ready = true;
</script>
</body>
</html>
